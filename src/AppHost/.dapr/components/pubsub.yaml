apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
spec:
  type: pubsub.redis
  version: v1
  metadata:
  - name: redisHost
    value: localhost:6379
  - name: redisPassword
    secretKeyRef:
      name: PUBSUB_REDISPASSWORD
      key: PUBSUB_REDISPASSWORD
  - name: enableTLS
    value: "false"
