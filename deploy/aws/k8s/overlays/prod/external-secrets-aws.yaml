apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: myapp-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: myapp-apps
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_AWS_REGION
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secrets
  namespace: myapp-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: redis-secrets
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: myapp/prod/redis/password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: myapp-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret-key
      remoteRef:
        key: myapp/prod/jwt/secret-key
    - secretKey: otlp-api-key
      remoteRef:
        key: myapp/prod/aspire/otlp-key
    - secretKey: otlp-header
      remoteRef:
        key: myapp/prod/aspire/otlp-header
    - secretKey: redis-connection
      remoteRef:
        key: myapp/prod/redis/connection
    - secretKey: sql-connection-authdb
      remoteRef:
        key: myapp/prod/sql/connection-authdb
    - secretKey: sql-connection-billingdb
      remoteRef:
        key: myapp/prod/sql/connection-billingdb
    - secretKey: sql-connection-inventorydb
      remoteRef:
        key: myapp/prod/sql/connection-inventorydb
    - secretKey: sql-connection-ordersdb
      remoteRef:
        key: myapp/prod/sql/connection-ordersdb
    - secretKey: sql-connection-purchasingdb
      remoteRef:
        key: myapp/prod/sql/connection-purchasingdb
    - secretKey: sql-connection-salesdb
      remoteRef:
        key: myapp/prod/sql/connection-salesdb
    - secretKey: sql-connection-crmdb
      remoteRef:
        key: myapp/prod/sql/connection-crmdb
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sql-secrets
  namespace: myapp-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: sql-secrets
    creationPolicy: Owner
  data:
    - secretKey: sa-password
      remoteRef:
        key: myapp/prod/sql/sa-password
    - secretKey: s3-bucket
      remoteRef:
        key: myapp/prod/backup/s3-bucket
    - secretKey: aws-region
      remoteRef:
        key: myapp/prod/backup/aws-region
