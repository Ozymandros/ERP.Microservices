apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: myapp-apps
spec:
  template:
    spec:
      containers:
        - name: mssql
          resources:
            requests:
              cpu: "500m"
              memory: "3Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
