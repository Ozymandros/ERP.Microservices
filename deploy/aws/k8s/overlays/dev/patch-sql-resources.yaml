apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: myapp-apps
spec:
  template:
    spec:
      containers:
        - name: mssql
          resources:
            requests:
              cpu: "250m"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "4Gi"
