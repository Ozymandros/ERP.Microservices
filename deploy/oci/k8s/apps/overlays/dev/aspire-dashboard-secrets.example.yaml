apiVersion: v1
kind: Secret
metadata:
  name: aspire-secrets
  namespace: myapp-platform
type: Opaque
stringData:
  # Used by Aspire Dashboard to authenticate OTLP requests.
  otlp-key: "replace-with-128bits-entropy-key"
  # Preformatted header value for OpenTelemetry OTLP exporters.
  otlp-header: "x-otlp-api-key=replace-with-128bits-entropy-key"

