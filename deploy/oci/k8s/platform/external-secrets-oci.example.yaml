apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: oci-vault-store
  namespace: myapp-platform
spec:
  provider:
    webhook:
      # Replace with your OCI Vault webhook provider endpoint or internal bridge service.
      # This is an integration placeholder for Phase 4 hardening.
      url: "https://replace-with-eso-oci-provider/v1/secrets"
      method: GET
      result:
        jsonPath: "$.value"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aspire-secrets
  namespace: myapp-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: oci-vault-store
  target:
    name: aspire-secrets
    creationPolicy: Owner
  data:
    - secretKey: otlp-key
      remoteRef:
        key: "myapp/dev/aspire/otlp-key"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: oci-vault-store
  namespace: myapp-apps
spec:
  provider:
    webhook:
      url: "https://replace-with-eso-oci-provider/v1/secrets"
      method: GET
      result:
        jsonPath: "$.value"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: myapp-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: oci-vault-store
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret-key
      remoteRef:
        key: "myapp/dev/jwt/secret-key"
    - secretKey: otlp-api-key
      remoteRef:
        key: "myapp/dev/aspire/otlp-key"
    - secretKey: otlp-header
      remoteRef:
        key: "myapp/dev/aspire/otlp-header"
    - secretKey: redis-connection
      remoteRef:
        key: "myapp/dev/redis/connection"
    - secretKey: sql-connection-authdb
      remoteRef:
        key: "myapp/dev/sql/connection-authdb"
    - secretKey: sql-connection-billingdb
      remoteRef:
        key: "myapp/dev/sql/connection-billingdb"
    - secretKey: sql-connection-inventorydb
      remoteRef:
        key: "myapp/dev/sql/connection-inventorydb"
    - secretKey: sql-connection-ordersdb
      remoteRef:
        key: "myapp/dev/sql/connection-ordersdb"
    - secretKey: sql-connection-purchasingdb
      remoteRef:
        key: "myapp/dev/sql/connection-purchasingdb"
    - secretKey: sql-connection-salesdb
      remoteRef:
        key: "myapp/dev/sql/connection-salesdb"
    - secretKey: sql-connection-crmdb
      remoteRef:
        key: "myapp/dev/sql/connection-crmdb"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-secrets
  namespace: myapp-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: oci-vault-store
  target:
    name: redis-secrets
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef:
        key: "myapp/dev/redis/password"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sql-secrets
  namespace: myapp-apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: oci-vault-store
  target:
    name: sql-secrets
    creationPolicy: Owner
  data:
    - secretKey: sa-password
      remoteRef:
        key: "myapp/dev/sql/sa-password"
    - secretKey: oci-bucket
      remoteRef:
        key: "myapp/dev/backup/oci-bucket"
    - secretKey: oci-region
      remoteRef:
        key: "myapp/dev/backup/oci-region"
    - secretKey: oci-namespace
      remoteRef:
        key: "myapp/dev/backup/oci-namespace"
    - secretKey: oci-access-key-id
      remoteRef:
        key: "myapp/dev/backup/oci-access-key-id"
    - secretKey: oci-secret-access-key
      remoteRef:
        key: "myapp/dev/backup/oci-secret-access-key"
