apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-master
  namespace: myapp-platform
  labels:
    app.kubernetes.io/name: redis-master
    app.kubernetes.io/part-of: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-master
        app.kubernetes.io/part-of: myapp
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secrets
                  key: redis-password
          command: ["sh", "-c"]
          args:
            - |
              set -e
              exec redis-server \
                --save "" \
                --appendonly no \
                --requirepass "$REDIS_PASSWORD"
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: myapp-platform
  labels:
    app.kubernetes.io/name: redis-master
    app.kubernetes.io/part-of: myapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-master
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
