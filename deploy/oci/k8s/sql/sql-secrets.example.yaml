apiVersion: v1
kind: Secret
metadata:
  name: sql-secrets
  namespace: myapp-apps
type: Opaque
stringData:
  # Must satisfy SQL Server complexity rules.
  sa-password: "replace-with-vault-synced-sa-password"
  # Optional backup settings for Object Storage S3-compatible upload.
  oci-bucket: "replace-bucket"
  oci-region: "replace-region"
  oci-namespace: "replace-namespace"
  oci-access-key-id: "replace-access-key-id"
  oci-secret-access-key: "replace-secret-access-key"
