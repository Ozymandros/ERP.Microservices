# DEV/STAGE ONLY — template for local Minikube smoke tests.
# Copy to stage-dev-secrets.yaml (gitignored) or let deploy-minikube-stage.ps1 generate it.
# Do not use in production or shared clusters.
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: myapp-platform
type: Opaque
stringData:
  redis-password: "replace-with-local-redis-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: myapp-apps
type: Opaque
stringData:
  redis-password: "replace-with-local-redis-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: sql-secrets
  namespace: myapp-apps
type: Opaque
stringData:
  sa-password: "replace-with-local-sql-password"
  sqladmin-password: "replace-with-local-sql-password"
---
apiVersion: v1
kind: Secret
metadata:
  name: aspire-secrets
  namespace: myapp-platform
type: Opaque
stringData:
  otlp-key: "replace-with-local-otlp-api-key-min-32-chars"
  otlp-header: "x-otlp-api-key=replace-with-local-otlp-api-key-min-32-chars"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: myapp-apps
type: Opaque
stringData:
  jwt-secret-key: "replace-with-local-jwt-secret-key-min-32-chars"
  otlp-api-key: "replace-with-local-otlp-api-key-min-32-chars"
  otlp-header: "x-otlp-api-key=replace-with-local-otlp-api-key-min-32-chars"
  redis-connection: "redis-master.myapp-platform.svc.cluster.local:6379,password=replace-with-local-redis-password,defaultDatabase=0,abortConnect=false,connectRetry=5,connectTimeout=5000,syncTimeout=5000"
  sql-connection-authdb: "Server=sqlserver,1433;Database=AuthDb;User Id=sqladmin;Password=replace-with-local-sql-password;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=10;ConnectRetryInterval=5;"
  sql-connection-billingdb: "Server=sqlserver,1433;Database=BillingDb;User Id=sqladmin;Password=replace-with-local-sql-password;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=10;ConnectRetryInterval=5;"
  sql-connection-inventorydb: "Server=sqlserver,1433;Database=InventoryDb;User Id=sqladmin;Password=replace-with-local-sql-password;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=10;ConnectRetryInterval=5;"
  sql-connection-ordersdb: "Server=sqlserver,1433;Database=OrdersDb;User Id=sqladmin;Password=replace-with-local-sql-password;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=10;ConnectRetryInterval=5;"
  sql-connection-purchasingdb: "Server=sqlserver,1433;Database=PurchasingDb;User Id=sqladmin;Password=replace-with-local-sql-password;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=10;ConnectRetryInterval=5;"
  sql-connection-salesdb: "Server=sqlserver,1433;Database=SalesDb;User Id=sqladmin;Password=replace-with-local-sql-password;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=10;ConnectRetryInterval=5;"
  sql-connection-crmdb: "Server=sqlserver,1433;Database=CrmDb;User Id=sqladmin;Password=replace-with-local-sql-password;TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=10;ConnectRetryInterval=5;"