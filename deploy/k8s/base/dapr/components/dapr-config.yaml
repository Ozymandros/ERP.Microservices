apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: myapp-apps
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: "aspire-dashboard.myapp-platform.svc.cluster.local:4317"
      isSecure: false
      protocol: grpc
      timeout: "30s"
      headers:
        - name: x-otlp-api-key
          secretKeyRef:
            name: app-secrets
            key: otlp-api-key
  secrets:
    scopes:
      - storeName: local-secrets
        defaultAccess: allow
