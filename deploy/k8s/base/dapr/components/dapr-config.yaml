apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: daprConfig
  namespace: myapp-apps
spec:
  tracing:
    samplingRate: "1"
    otel:
      endpointAddress: "aspire-dashboard.myapp-platform.svc.cluster.local:4317"
      isSecure: false
      protocol: grpc
      timeout: "30s"
      headers:
        - name: x-otlp-api-key
          secretKeyRef:
            name: app-secrets
            key: otlp-api-key
  mtls:
    enabled: false
  accessControl:
    defaultAction: allow
    trustDomain: localhost
    policies:
      - appId: gateway
        actions: ["*"]
      - appId: auth-service
        actions: ["invoke/*"]
      - appId: billing-service
        actions: ["invoke/*"]
      - appId: inventory-service
        actions: ["invoke/*"]
      - appId: orders-service
        actions: ["invoke/*"]
      - appId: purchasing-service
        actions: ["invoke/*"]
      - appId: sales-service
        actions: ["invoke/*"]
      - appId: crm-service
        actions: ["invoke/*"]
  secrets:
    scopes:
      - storeName: local-secrets
        defaultAccess: allow
