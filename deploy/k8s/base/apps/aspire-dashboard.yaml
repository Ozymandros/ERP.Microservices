apiVersion: apps/v1
kind: Deployment
metadata:
  name: aspire-dashboard
  namespace: myapp-platform
  labels:
    app.kubernetes.io/name: aspire-dashboard
    app.kubernetes.io/part-of: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aspire-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aspire-dashboard
        app.kubernetes.io/part-of: myapp
    spec:
      containers:
        - name: aspire-dashboard
          image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: ui
              containerPort: 18888
            - name: otlp-grpc
              containerPort: 18889
            - name: otlp-http
              containerPort: 18890
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:18888"
            - name: ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL
              value: "http://0.0.0.0:18889"
            - name: ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL
              value: "http://0.0.0.0:18890"
            - name: DASHBOARD__OTLP__AUTHMODE
              value: "ApiKey"
            - name: DASHBOARD__OTLP__PRIMARYAPIKEY
              valueFrom:
                secretKeyRef:
                  name: aspire-secrets
                  key: otlp-key
            - name: DASHBOARD__TELEMETRYLIMITS__MAXLOGCOUNT
              value: "50000"
            - name: DASHBOARD__TELEMETRYLIMITS__MAXTRACECOUNT
              value: "50000"
            - name: DASHBOARD__TELEMETRYLIMITS__MAXMETRICCOUNT
              value: "50000"
          readinessProbe:
            httpGet:
              path: /health
              port: 18888
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 18888
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard
  namespace: myapp-platform
  labels:
    app.kubernetes.io/name: aspire-dashboard
    app.kubernetes.io/part-of: myapp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aspire-dashboard
  ports:
    - name: ui
      port: 18888
      targetPort: 18888
    - name: otlp-grpc
      port: 4317
      targetPort: 18889
    - name: otlp-http
      port: 4318
      targetPort: 18890

