# Contract: keys required in myapp-platform/aspire-secrets (manual or ESO-managed).
# Used by: deploy/k8s/base/apps/aspire-dashboard.yaml
#   env DASHBOARD__OTLP__PRIMARYAPIKEY → secretKeyRef name=aspire-secrets key=otlp-key
# Note: metadata.name uses the '-contract' suffix to mark this as a documentation-only
#       template; the real secret is named 'aspire-secrets' (created by ESO or manually).
apiVersion: v1
kind: Secret
metadata:
  name: aspire-secrets-contract
  namespace: myapp-platform
type: Opaque
stringData:
  otlp-key: "<required>"
