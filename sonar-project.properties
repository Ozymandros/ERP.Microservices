# SonarCloud Configuration for .NET 10 ERP Microservices

# Project identification
sonar.projectKey=Ozymandros_ERP.Microservices
sonar.projectName=ERP Microservices
sonar.organization=ozymandros

# Source code paths
sonar.sources=src/
sonar.tests=test/
sonar.sourceEncoding=UTF-8

# .NET specific settings
sonar.language=cs
sonar.dotnet.excludeGeneratedCode=true

# Coverage settings (OpenCover format from coverlet)
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverageReportPaths=**/coverage.opencover.xml

# Test settings
sonar.test.inclusions=**/*.Tests.csproj,**/*Tests/**,**/test/**
sonar.test.exclusions=**/bin/**,**/obj/**

# Exclusions
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/Migrations/**,\
  **/Properties/**,\
  **/*.xaml.cs,\
  **/*.Designer.cs,\
  **/App.xaml.cs,\
  **/AssemblyInfo.cs

# Duplication exclusions
sonar.cpd.exclusions=\
  **/Migrations/**,\
  **/obj/**,\
  **/bin/**

# Code smells and issues
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=common-java:DuplicatedBlocks
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.cs
sonar.issue.ignore.multicriteria.e2.ruleKey=csharpsquid:S1118
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*Program.cs

# Analysis settings
sonar.verbose=false
sonar.links.homepage=https://github.com/Ozymandros/ERP.Microservices
sonar.links.ci=https://github.com/Ozymandros/ERP.Microservices/actions
sonar.links.scm=https://github.com/Ozymandros/ERP.Microservices
sonar.links.issue=https://github.com/Ozymandros/ERP.Microservices/issues
