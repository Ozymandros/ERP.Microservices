# BuildKit optimization: Enable faster builds with cache mounts
x-buildkit: &buildkit
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

x-api-env: &api-env
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000;http://localhost:5000}
  Jwt__SecretKey: ${JWT_SECRET:-una_clau_molt_llarga_i_super_ultra_secreta_01234566789}
  Jwt__Issuer: ${JWT_ISSUER:-MyApp.Auth}
  Jwt__Audience: ${JWT_AUDIENCE:-MyApp.All}
  ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD:-Redis@Secure123!},defaultDatabase=0,abortConnect=false,connectRetry=5,connectTimeout=5000,syncTimeout=5000
  Jwt__RequireHttpsMetadata: "false"
  DAPR_HTTP_PORT: "3500"
  DAPR_GRPC_PORT: "50001"

services:
  auth-service-dapr:
    image: daprio/dapr:1.15.6
    container_name: auth-service-dapr
    depends_on:
      - auth-service
      - dapr-placement
    command:
      [
        "./daprd",
        "-app-id", "auth-service",
        "-app-port", "8080",
        "-components-path", "/components",
        "-placement-host-address", "dapr-placement:50005",
        "-log-level", "info"
      ]
    volumes:
      - ./deploy/dapr/components:/components:ro
    network_mode: "service:auth-service"
    restart: unless-stopped
  billing-service:
    build:
      context: ./src
      dockerfile: MyApp.Billing/MyApp.Billing.API/Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: billing-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000;http://localhost:5000}
      Jwt__SecretKey: ${JWT_SECRET:-una_clau_molt_llarga_i_super_ultra_secreta_01234566789}
      Jwt__Issuer: ${JWT_ISSUER:-MyApp.Auth}
      Jwt__Audience: ${JWT_AUDIENCE:-MyApp.All}
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD:-Redis@Secure123!},defaultDatabase=0,abortConnect=false,connectRetry=5,connectTimeout=5000,syncTimeout=5000
      Jwt__RequireHttpsMetadata: "false"
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      ConnectionStrings__BillingDb: Server=sqlserver,1433;Database=BillingDB;User Id=sa;Password=${SQL_PASSWORD:-P@ssw0rd12345!};TrustServerCertificate=True;Encrypt=False;ConnectRetryCount=10;ConnectRetryInterval=5;
    depends_on:
      - auth-service-dapr
      - redis
    ports:
      - "6002:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - erp
    restart: unless-stopped


  redis-insight:
    image: redis/redisinsight:2.66
    container_name: redis-insight
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - erp
    restart: unless-stopped

  dapr-placement:
    image: daprio/dapr:1.15.6
    container_name: dapr-placement
    command: ["./placement", "-port", "50005", "-log-level", "info"]
    ports:
      - "50005:50005"
    networks:
      - erp
    restart: unless-stopped

  # dapr-sentry:
  #   image: daprio/dapr:1.15.6
  #   container_name: dapr-sentry
  #   command: ["./sentry", "-port", "50001", "-log-level", "info"]
  #   ports:
  #     - "50001:50001"
  #   networks:
  #     - erp
  #   depends_on:
  #     - dapr-placement
  #   restart: unless-stopped

  # Build shared base image for microservices
  # IMPORTANT: This must be built BEFORE services that use myapp-microservices-base:10.0
  # Build command: docker-compose build microservices-base
  # Or build all: docker-compose build (this service will build first)
  microservices-base:
    build:
      context: .
      dockerfile: docker/microservices-base.Dockerfile
    image: myapp-microservices-base:10.0
    # This service only builds the image; container exits immediately
    command: ["/bin/sh", "-c", "echo 'Base image built' && sleep 1 && exit 0"]
    restart: "no"  # Don't restart this build-only service

  erpapigateway:
    build:
      context: ./src
      dockerfile: ErpApiGateway/Dockerfile.local
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000;http://localhost:5000}
      Jwt__SecretKey: ${JWT_SECRET:-una_clau_molt_llarga_i_super_ultra_secreta_01234566789}
      Jwt__Issuer: ${JWT_ISSUER:-MyApp.Auth}
      Jwt__Audience: ${JWT_AUDIENCE:-MyApp.All}
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD:-Redis@Secure123!},defaultDatabase=0,abortConnect=false,connectRetry=5,connectTimeout=5000,syncTimeout=5000
      Jwt__RequireHttpsMetadata: "false"
      DAPR_HTTP_PORT: "3500"
      DAPR_GRPC_PORT: "50001"
      # NOTE: Route host/port come from the mounted ocelot.json
      # (service-dns + 8080 for every route). No per-route env overrides —
      # per-route indexes would desynchronize whenever routes are added/reordered.
      Ocelot__GlobalConfiguration__BaseUrl: http://localhost:5000
    ports:
      - "5000:8080"
    depends_on:
      auth-service:
        condition: service_started
      billing-service:
        condition: service_started
      crm-service:
        condition: service_started
      inventory-service:
        condition: service_started
      orders-service:
        condition: service_started
      purchasing-service:
        condition: service_started
      sales-service:
        condition: service_started
      sk-service:
        condition: service_started
    volumes:
      - ./src/ErpApiGateway/ocelot.json:/app/ocelot.json:ro
      - ./_site:/_site:ro  # Mount DocFX documentation directory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10           # ✅ More retries (was 3)
      start_period: 120s    # ✅ 2 minutes startup time (was 30s)
    networks:
      - erp
    restart: unless-stopped

  auth-service:
    build:
      context: ./src
      dockerfile: MyApp.Auth/MyApp.Auth.API/Dockerfile.local
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: auth-service
    environment:
