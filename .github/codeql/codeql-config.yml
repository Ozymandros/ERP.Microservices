name: "CodeQL Configuration"

# Security-focused suite only. Do not use security-and-quality here — it floods
# the GitHub Security tab with maintainability findings (unused locals, etc.).
queries:
  - uses: security-extended

packs:
  - ./.github/codeql

paths-ignore:
  - '**/bin/**'
  - '**/obj/**'
  - '**/Migrations/**'
  - '**/test/**'
  - '**/Tests/**'
  - '**/*Tests/**'
  - '**/*.Tests/**'
  - '**/*.Designer.cs'
  - '**/*.g.cs'
  - '**/*.g.i.cs'
  - '**/generated/**'
