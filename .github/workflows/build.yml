name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup Dapr CLI
        uses: dapr/setup-dapr@v1
        with:
          version: "1.14.4" # Latest stable as of early 2025

      - name: Initialize Dapr
        run: |
          echo "Initializing Dapr runtime..."
          dapr init --slim
          
          # Export Dapr paths for tests
          DAPR_PATH=$(which dapr)
          echo "DaprCliPath=$DAPR_PATH" >> $GITHUB_ENV
          echo "DAPR_HOME=$HOME/.dapr" >> $GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore ERP.Microservices.sln

      - name: Build solution
        run: dotnet build ERP.Microservices.sln --configuration Release --no-restore

      - name: Run tests
        env:
          DaprCliPath: ${{ env.DaprCliPath }}
          DAPR_HOME: ${{ env.DAPR_HOME }}
        run: |
          dotnet test ERP.Microservices.sln \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory "TestResults"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/**/*.trx"
          retention-days: 30
