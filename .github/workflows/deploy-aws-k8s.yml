name: Deploy AWS Kubernetes Stack

on:
  workflow_dispatch:
    inputs:
      image_step:
        description: "Container image stage"
        required: true
        default: skip
        type: choice
        options:
          - skip
          - build
          - build-push
      app_image_tag:
        description: "Optional explicit app image tag (default: short SHA)"
        required: false
        default: ""
        type: string
      infra_step:
        description: "OpenTofu stage before Kubernetes deploy"
        required: true
        default: skip
        type: choice
        options:
          - skip
          - validate
          - apply
      profile:
        description: "Deployment profile"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      apply_mode:
        description: "Validation mode or real apply"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - apply
      ingress_domain:
        description: "Required for prod profile (example: api.example.com)"
        required: false
        default: ""
        type: string
      letsencrypt_issuer:
        description: "Used by prod profile patch"
        required: true
        default: letsencrypt-staging
        type: choice
        options:
          - letsencrypt-staging
          - letsencrypt-prod
      aws_region:
        description: "Optional override for OpenTofu var.aws_region"
        required: false
        default: ""
        type: string
      bootstrap_oidc:
        description: "First-time: run Bootstrap AWS Infrastructure (needs AWS_BOOTSTRAP_* secrets)"
        required: false
        default: false
        type: boolean

concurrency:
  group: aws-k8s-${{ github.ref }}-${{ github.event.inputs.profile }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare deployment context
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      do_build: ${{ steps.vars.outputs.do_build }}
      do_push: ${{ steps.vars.outputs.do_push }}
      kustomize_path: ${{ steps.vars.outputs.kustomize_path }}
    steps:
      - name: Compute execution variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.app_image_tag }}"
          IMAGE_STEP="${{ github.event.inputs.image_step }}"
          APPLY_MODE="${{ github.event.inputs.apply_mode }}"
          PROFILE="${{ github.event.inputs.profile }}"

          if [[ -n "$INPUT_TAG" ]]; then
            IMAGE_TAG="$INPUT_TAG"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi

          DO_BUILD="false"
          DO_PUSH="false"
          if [[ "$IMAGE_STEP" != "skip" ]]; then
            DO_BUILD="true"
          fi
          if [[ "$IMAGE_STEP" == "build-push" && "$APPLY_MODE" == "apply" ]]; then
            DO_PUSH="true"
          fi

          if [[ "$PROFILE" == "prod" ]]; then
            KUSTOMIZE_PATH="deploy/aws/k8s/overlays/prod"
          else
            KUSTOMIZE_PATH="deploy/aws/k8s/overlays/dev"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "do_build=$DO_BUILD" >> "$GITHUB_OUTPUT"
          echo "do_push=$DO_PUSH" >> "$GITHUB_OUTPUT"
          echo "kustomize_path=$KUSTOMIZE_PATH" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build service images
    needs: prepare
    if: ${{ needs.prepare.outputs.do_build == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-build-service-images.yml
    with:
      image_tag: ${{ needs.prepare.outputs.image_tag }}
      do_push: ${{ needs.prepare.outputs.do_push == 'true' }}
      platform: linux/amd64

  bootstrap-aws:
    name: Bootstrap AWS OIDC + infra
    if: ${{ github.event.inputs.bootstrap_oidc == true }}
    uses: ./.github/workflows/bootstrap-aws-infrastructure.yml
    secrets: inherit
    with:
      profile: ${{ github.event.inputs.profile }}
      aws_region: ${{ github.event.inputs.aws_region }}
      auto_approve: "true"

  deploy-k8s:
    name: Deploy AWS EKS (${{ github.event.inputs.profile }})
    needs: [prepare, build-images, bootstrap-aws]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') && (needs.bootstrap-aws.result == 'success' || needs.bootstrap-aws.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ github.event.inputs.profile }}"
          DOMAIN="${{ github.event.inputs.ingress_domain }}"
          if [[ "$PROFILE" == "prod" && -z "$DOMAIN" ]]; then
            echo "ingress_domain is required when profile=prod"
            exit 1
          fi
          if [[ "${{ github.event.inputs.image_step }}" == "build-push" && "${{ github.event.inputs.apply_mode }}" != "apply" ]]; then
            echo "build-push only works with apply_mode=apply"
            exit 1
          fi

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Resolve AWS deploy role ARN
        shell: bash
        env:
          BOOTSTRAP_ROLE: ${{ needs.bootstrap-aws.outputs.deploy_role_arn }}
        run: |
          set -euo pipefail
          AWS_DEPLOY_ROLE_ARN="$BOOTSTRAP_ROLE"
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            AWS_DEPLOY_ROLE_ARN="${{ vars.AWS_DEPLOY_ROLE_ARN }}"
          fi
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            AWS_DEPLOY_ROLE_ARN="${{ secrets.AWS_DEPLOY_ROLE_ARN }}"
          fi
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN is required."
            echo "Fix OIDC: run workflow 'Bootstrap AWS Infrastructure (OIDC)' with AWS_BOOTSTRAP_* secrets,"
            echo "or locally: cd deploy/aws/tofu && tofu apply && tofu output -raw github_actions_deploy_role_arn"
            echo "Set repository variable AWS_DEPLOY_ROLE_ARN to that ARN."
            exit 1
          fi
          echo "AWS_DEPLOY_ROLE_ARN=$AWS_DEPLOY_ROLE_ARN" >> "$GITHUB_ENV"

      - name: Resolve AWS region for credentials
        shell: bash
        env:
          PROFILE: ${{ github.event.inputs.profile }}
          INPUT_AWS_REGION: ${{ github.event.inputs.aws_region }}
          VAR_AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          read_tfvar() {
            local name="$1" file="$2" default="${3:-}"
            [[ ! -f "$file" ]] && { echo "$default"; return; }
            local line
            line="$(grep -E "^[[:space:]]*${name}[[:space:]]*=" "$file" | tail -1 || true)"
            [[ -z "$line" ]] && { echo "$default"; return; }
            echo "$line" | sed -E 's/^[^=]+=[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/' | tr -d "'"
          }
          TOFU_DIR="deploy/aws/tofu"
          if [[ -f "${TOFU_DIR}/terraform.tfvars" ]]; then
            TFVARS_FILE="terraform.tfvars"
            TFVARS_PATH="${TOFU_DIR}/terraform.tfvars"
          elif [[ -f "${TOFU_DIR}/environments/${PROFILE}/terraform.tfvars" ]]; then
            TFVARS_FILE="environments/${PROFILE}/terraform.tfvars"
            TFVARS_PATH="${TOFU_DIR}/${TFVARS_FILE}"
          else
            TFVARS_FILE="environments/${PROFILE}/terraform.tfvars.example"
            TFVARS_PATH="${TOFU_DIR}/${TFVARS_FILE}"
          fi
          AWS_REGION="$INPUT_AWS_REGION"
          if [[ -z "$AWS_REGION" ]]; then
            AWS_REGION="$VAR_AWS_REGION"
          fi
          if [[ -z "$AWS_REGION" ]]; then
            AWS_REGION="$(read_tfvar aws_region "$TFVARS_PATH" "eu-west-1")"
          fi
          {
            echo "AWS_REGION=$AWS_REGION"
            echo "TOFU_VAR_FILE=$TFVARS_FILE"
          } >> "$GITHUB_ENV"
          if [[ -n "$INPUT_AWS_REGION" ]]; then
            echo "TOFU_AWS_REGION_VAR=-var=aws_region=${INPUT_AWS_REGION}" >> "$GITHUB_ENV"
          elif [[ -n "$VAR_AWS_REGION" ]]; then
            echo "TOFU_AWS_REGION_VAR=-var=aws_region=${VAR_AWS_REGION}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: OIDC bootstrap hint
        if: ${{ failure() && steps.aws_creds.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::GitHub OIDC provider missing or role ARN wrong for this AWS account."
          echo "1. Add secrets AWS_BOOTSTRAP_ACCESS_KEY_ID + AWS_BOOTSTRAP_SECRET_ACCESS_KEY (admin IAM user)."
          echo "2. Run 'Bootstrap AWS Infrastructure (OIDC)' OR re-run this workflow with bootstrap_oidc=true."
          echo "3. Set variable AWS_DEPLOY_ROLE_ARN from the workflow summary output."
          echo "4. Delete bootstrap secrets, re-run deploy."

      - name: Resolve AWS cluster and region from OpenTofu
        working-directory: deploy/aws/tofu
        shell: bash
        env:
          TOFU_VAR_FILE: ${{ env.TOFU_VAR_FILE }}
          TOFU_AWS_REGION_VAR: ${{ env.TOFU_AWS_REGION_VAR }}
          BOOTSTRAP_CLUSTER: ${{ needs.bootstrap-aws.outputs.eks_cluster_name }}
          BOOTSTRAP_REGION: ${{ needs.bootstrap-aws.outputs.aws_region }}
        run: |
          set -euo pipefail

          if [[ -n "$BOOTSTRAP_CLUSTER" ]]; then
            echo "AWS_EKS_CLUSTER_NAME=${BOOTSTRAP_CLUSTER}" >> "$GITHUB_ENV"
            echo "AWS_REGION=${BOOTSTRAP_REGION}" >> "$GITHUB_ENV"
            echo "Using cluster/region from bootstrap job."
            exit 0
          fi

          read_tfvar() {
            local name="$1" file="$2" default="${3:-}"
            [[ ! -f "$file" ]] && { echo "$default"; return; }
            local line
            line="$(grep -E "^[[:space:]]*${name}[[:space:]]*=" "$file" | tail -1 || true)"
            [[ -z "$line" ]] && { echo "$default"; return; }
            echo "$line" | sed -E 's/^[^=]+=[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/' | tr -d "'"
          }

          tofu_output() {
            tofu output -raw "$1" 2>/dev/null || true
          }

          tofu init -input=false

          AWS_EKS_CLUSTER_NAME="$(tofu_output eks_cluster_name)"
          if [[ -z "$AWS_EKS_CLUSTER_NAME" || "$AWS_EKS_CLUSTER_NAME" == "null" ]]; then
            AWS_EKS_CLUSTER_NAME="$(tofu_output planned_eks_cluster_name)"
          fi

          AWS_REGION="$(tofu_output aws_region)"
          if [[ -z "$AWS_REGION" || "$AWS_REGION" == "null" ]]; then
            AWS_REGION="${{ env.AWS_REGION }}"
          fi

          if [[ -z "$AWS_EKS_CLUSTER_NAME" || "$AWS_EKS_CLUSTER_NAME" == "null" ]]; then
            PROJECT="$(read_tfvar project "$TOFU_VAR_FILE" "myapp")"
            ENVIRONMENT="$(read_tfvar environment "$TOFU_VAR_FILE" "${{ github.event.inputs.profile }}")"
            AWS_EKS_CLUSTER_NAME="${PROJECT}-${ENVIRONMENT}-eks"
            echo "No OpenTofu state yet; using naming convention: ${AWS_EKS_CLUSTER_NAME}"
          else
            echo "Resolved cluster from OpenTofu output: ${AWS_EKS_CLUSTER_NAME}"
          fi

          echo "AWS_EKS_CLUSTER_NAME=${AWS_EKS_CLUSTER_NAME}" >> "$GITHUB_ENV"
          echo "AWS_REGION=${AWS_REGION}" >> "$GITHUB_ENV"

      - name: OpenTofu validate/plan
        if: ${{ github.event.inputs.infra_step == 'validate' }}
        shell: bash
        working-directory: deploy/aws/tofu
        env:
          TOFU_VAR_FILE: ${{ env.TOFU_VAR_FILE }}
          TOFU_AWS_REGION_VAR: ${{ env.TOFU_AWS_REGION_VAR }}
        run: |
          set -euo pipefail
          VAR_ARGS=(-var-file="$TOFU_VAR_FILE")
          if [[ -n "${TOFU_AWS_REGION_VAR:-}" ]]; then
            VAR_ARGS+=("$TOFU_AWS_REGION_VAR")
          fi
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate "${VAR_ARGS[@]}"
          tofu plan -refresh=false -lock=false "${VAR_ARGS[@]}"

      - name: OpenTofu apply
        if: ${{ github.event.inputs.infra_step == 'apply' }}
        shell: bash
        working-directory: deploy/aws/tofu
        env:
          TOFU_VAR_FILE: ${{ env.TOFU_VAR_FILE }}
          TOFU_AWS_REGION_VAR: ${{ env.TOFU_AWS_REGION_VAR }}
        run: |
          set -euo pipefail
          VAR_ARGS=(-var-file="$TOFU_VAR_FILE")
          if [[ -n "${TOFU_AWS_REGION_VAR:-}" ]]; then
            VAR_ARGS+=("$TOFU_AWS_REGION_VAR")
          fi
          tofu fmt -check -recursive
          tofu init -input=false
          tofu validate "${VAR_ARGS[@]}"
          tofu apply -auto-approve "${VAR_ARGS[@]}"

      - name: Refresh AWS settings from OpenTofu outputs
        if: ${{ github.event.inputs.infra_step == 'apply' }}
        shell: bash
        working-directory: deploy/aws/tofu
        run: |
          set -euo pipefail
          ROLE="$(tofu output -raw github_actions_deploy_role_arn 2>/dev/null || true)"
          if [[ -n "$ROLE" && "$ROLE" != "null" ]]; then
            echo "AWS_DEPLOY_ROLE_ARN=$ROLE" >> "$GITHUB_ENV"
          fi
          echo "AWS_EKS_CLUSTER_NAME=$(tofu output -raw eks_cluster_name)" >> "$GITHUB_ENV"
          echo "AWS_REGION=$(tofu output -raw aws_region)" >> "$GITHUB_ENV"
          echo "Refreshed AWS settings from tofu output after apply."

      - name: Update kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "${{ env.AWS_EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"
          kubectl config current-context

      - name: Patch prod ingress host and issuer
        if: ${{ github.event.inputs.profile == 'prod' }}
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="${{ github.event.inputs.ingress_domain }}"
          ISSUER="${{ github.event.inputs.letsencrypt_issuer }}"
          PATCH_FILE="deploy/k8s/overlays/prod/patch-gateway-ingress-letsencrypt.yaml"
          sed -i "s/api.replace-with-real-domain.com/${DOMAIN}/g" "$PATCH_FILE"
          sed -i "s/letsencrypt-staging/${ISSUER}/g" "$PATCH_FILE"
          echo "Patched $PATCH_FILE with domain=${DOMAIN} issuer=${ISSUER}"

      - name: Patch deployment image tags
        uses: ./.github/actions/patch-k8s-image-tags
        with:
          image_tag: ${{ needs.prepare.outputs.image_tag }}

      - name: Validate manifests
        if: ${{ github.event.inputs.apply_mode == 'validate' }}
        shell: bash
        run: |
          set -euo pipefail
          KUSTOMIZE_PATH="${{ needs.prepare.outputs.kustomize_path }}"
          kubectl apply --dry-run=client -k "$KUSTOMIZE_PATH"
          kubectl apply --dry-run=client -f deploy/k8s/base/dapr/components/dapr-config.yaml
          kubectl apply --dry-run=client -f deploy/k8s/base/dapr/components/statestore.yaml
          kubectl apply --dry-run=client -f deploy/k8s/base/dapr/components/pubsub.yaml

      - name: Apply manifests
        if: ${{ github.event.inputs.apply_mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          KUSTOMIZE_PATH="${{ needs.prepare.outputs.kustomize_path }}"
          kubectl apply -k "$KUSTOMIZE_PATH"
          kubectl apply -f deploy/k8s/base/dapr/components/dapr-config.yaml
          kubectl apply -f deploy/k8s/base/dapr/components/statestore.yaml
          kubectl apply -f deploy/k8s/base/dapr/components/pubsub.yaml

      - name: Post-deploy quick checks
        if: ${{ github.event.inputs.apply_mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl get pods -A
          kubectl get ingress -A
