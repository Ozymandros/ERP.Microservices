name: Deploy OCI Kubernetes Stack

on:
  workflow_dispatch:
    inputs:
      image_step:
        description: "Container image stage"
        required: true
        default: "skip"
        type: choice
        options:
          - skip
          - build
          - build-push
      app_image_tag:
        description: "Optional explicit app image tag (default: short SHA)"
        required: false
        default: ""
        type: string
      infra_step:
        description: "OpenTofu stage before Kubernetes deploy"
        required: true
        default: "skip"
        type: choice
        options:
          - skip
          - validate
          - apply
      profile:
        description: "Deployment profile"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      apply_mode:
        description: "Validation mode or real apply"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - apply
      ingress_domain:
        description: "Required for prod profile (example: api.example.com)"
        required: false
        default: ""
        type: string
      letsencrypt_issuer:
        description: "Used by prod profile patch"
        required: true
        default: "letsencrypt-staging"
        type: choice
        options:
          - letsencrypt-staging
          - letsencrypt-prod

concurrency:
  group: oci-k8s-${{ github.ref }}-${{ github.event.inputs.profile }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare deployment context
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      do_build: ${{ steps.vars.outputs.do_build }}
      do_push: ${{ steps.vars.outputs.do_push }}
    steps:
      - name: Compute execution variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.app_image_tag }}"
          IMAGE_STEP="${{ github.event.inputs.image_step }}"
          APPLY_MODE="${{ github.event.inputs.apply_mode }}"

          if [[ -n "$INPUT_TAG" ]]; then
            IMAGE_TAG="$INPUT_TAG"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi

          DO_BUILD="false"
          DO_PUSH="false"
          if [[ "$IMAGE_STEP" != "skip" ]]; then
            DO_BUILD="true"
          fi
          if [[ "$IMAGE_STEP" == "build-push" && "$APPLY_MODE" == "apply" ]]; then
            DO_PUSH="true"
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "do_build=$DO_BUILD" >> "$GITHUB_OUTPUT"
          echo "do_push=$DO_PUSH" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ARM64 images
    needs: prepare
    if: ${{ needs.prepare.outputs.do_build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            dockerfile: src/MyApp.Auth/MyApp.Auth.API/Dockerfile
          - service: billing-service
            dockerfile: src/MyApp.Billing/MyApp.Billing.API/Dockerfile
          - service: inventory-service
            dockerfile: src/MyApp.Inventory/MyApp.Inventory.API/Dockerfile
          - service: orders-service
            dockerfile: src/MyApp.Orders/MyApp.Orders.API/Dockerfile
          - service: purchasing-service
            dockerfile: src/MyApp.Purchasing/MyApp.Purchasing.API/Dockerfile
          - service: sales-service
            dockerfile: src/MyApp.Sales/MyApp.Sales.API/Dockerfile
          - service: crm-service
            dockerfile: src/MyApp.Crm/MyApp.Crm.API/Dockerfile
          - service: agentic-service
            dockerfile: src/MyApp.Agentic/MyApp.Agentic.API/Dockerfile
          - service: gateway
            dockerfile: src/ErpApiGateway/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ needs.prepare.outputs.do_push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or build+push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ needs.prepare.outputs.do_push == 'true' }}
          tags: |
            ghcr.io/${{ github.repository }}/myapp-${{ matrix.service }}:${{ needs.prepare.outputs.image_tag }}
            ghcr.io/${{ github.repository }}/myapp-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-k8s:
    name: Deploy OCI K8s (${{ github.event.inputs.profile }})
    needs: [prepare, build-images]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ github.event.inputs.profile }}"
          DOMAIN="${{ github.event.inputs.ingress_domain }}"
          INFRA_STEP="${{ github.event.inputs.infra_step }}"
          if [[ "$PROFILE" == "prod" && -z "$DOMAIN" ]]; then
            echo "ingress_domain is required when profile=prod"
            exit 1
          fi
          if [[ "${{ github.event.inputs.image_step }}" == "build-push" && "${{ github.event.inputs.apply_mode }}" != "apply" ]]; then
            echo "build-push only works with apply_mode=apply"
            exit 1
          fi
          if [[ "$INFRA_STEP" != "skip" && -z "${{ secrets.OCI_TENANCY_OCID }}" ]]; then
            echo "infra_step requires OCI_TENANCY_OCID and related OCI secrets"
            exit 1
          fi

      - name: Setup OpenTofu
        if: ${{ github.event.inputs.infra_step != 'skip' }}
        uses: opentofu/setup-opentofu@v1

      - name: Prepare OpenTofu auth
        if: ${{ github.event.inputs.infra_step != 'skip' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          echo "${{ secrets.OCI_API_PRIVATE_KEY_B64 }}" | base64 -d > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          {
            echo "TF_VAR_tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}"
            echo "TF_VAR_user_ocid=${{ secrets.OCI_USER_OCID }}"
            echo "TF_VAR_fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "TF_VAR_private_key_path=$HOME/.oci/oci_api_key.pem"
            echo "TF_VAR_region=${{ secrets.OCI_REGION }}"
          } >> "$GITHUB_ENV"

      - name: OpenTofu validate/plan
        if: ${{ github.event.inputs.infra_step == 'validate' }}
        shell: bash
        working-directory: deploy/oci/tofu
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate
          tofu plan -refresh=false -lock=false

      - name: OpenTofu apply
        if: ${{ github.event.inputs.infra_step == 'apply' }}
        shell: bash
        working-directory: deploy/oci/tofu
        run: |
          set -euo pipefail
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate
          tofu apply -auto-approve

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Setup kubeconfig from secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.OCI_KUBECONFIG_B64 }}" ]]; then
            echo "Missing required secret: OCI_KUBECONFIG_B64"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.OCI_KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Patch prod ingress host and issuer
        if: ${{ github.event.inputs.profile == 'prod' }}
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="${{ github.event.inputs.ingress_domain }}"
          ISSUER="${{ github.event.inputs.letsencrypt_issuer }}"
          PATCH_FILE="deploy/oci/k8s/apps/overlays/prod/patch-gateway-ingress-letsencrypt.yaml"
          sed -i "s/api.replace-with-real-domain.com/${DOMAIN}/g" "$PATCH_FILE"
          sed -i "s/letsencrypt-staging/${ISSUER}/g" "$PATCH_FILE"
          echo "Patched $PATCH_FILE with domain=${DOMAIN} issuer=${ISSUER}"

      - name: Patch deployment image tags
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
          REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}"
          for svc in auth-service billing-service inventory-service orders-service purchasing-service sales-service crm-service agentic-service gateway; do
            find deploy/oci/k8s/apps -type f -name "*.yaml" -exec sed -i "s|ghcr.io/replace-org/replace-repo/myapp-${svc}:latest|${REPO}/myapp-${svc}:${IMAGE_TAG}|g" {} +
          done
          echo "Patched app images to tag ${IMAGE_TAG}"

      - name: Validate manifests
        if: ${{ github.event.inputs.apply_mode == 'validate' }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply --dry-run=client -k deploy/oci/k8s/platform
          kubectl apply --dry-run=client -f deploy/oci/k8s/dapr/components/dapr-config.yaml
          kubectl apply --dry-run=client -f deploy/oci/k8s/dapr/components/statestore.yaml
          kubectl apply --dry-run=client -f deploy/oci/k8s/dapr/components/pubsub.yaml
          kubectl apply --dry-run=client -k deploy/oci/k8s/sql
          if [[ "${{ github.event.inputs.profile }}" == "prod" ]]; then
            kubectl apply --dry-run=client -k deploy/oci/k8s/apps/overlays/prod
          else
            kubectl apply --dry-run=client -k deploy/oci/k8s/apps
          fi

      - name: Apply manifests
        if: ${{ github.event.inputs.apply_mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -k deploy/oci/k8s/platform
          kubectl apply -f deploy/oci/k8s/dapr/components/dapr-config.yaml
          kubectl apply -f deploy/oci/k8s/dapr/components/statestore.yaml
          kubectl apply -f deploy/oci/k8s/dapr/components/pubsub.yaml
          kubectl apply -k deploy/oci/k8s/sql
          if [[ "${{ github.event.inputs.profile }}" == "prod" ]]; then
            kubectl apply -k deploy/oci/k8s/apps/overlays/prod
          else
            kubectl apply -k deploy/oci/k8s/apps
          fi

      - name: Post-deploy quick checks
        if: ${{ github.event.inputs.apply_mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl get pods -A
          kubectl get ingress -A
