name: SonarCloud Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write # Required for SonarCloud PR comments

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install coverage tool
        run: dotnet tool install --global dotnet-coverage

      - name: Install Dapr CLI
        run: |
          curl --proto "=https" --tlsv1.2 -fsSL https://raw.githubusercontent.com/dapr/cli/master/install/install.sh | /bin/bash -s 1.13.0

      - name: Initialize Dapr
        run: |
          echo "Initializing Dapr runtime..."
          dapr init --slim
          
          # Export Dapr paths for tests
          DAPR_PATH=$(which dapr)
          echo "DaprCliPath=$DAPR_PATH" >> $GITHUB_ENV
          echo "DAPR_HOME=$HOME/.dapr" >> $GITHUB_ENV

      - name: Begin SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORG: ${{ secrets.SONAR_ORG }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORG" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.sources="src" \
            /d:sonar.cs.vstest.reportsPaths="${{ github.workspace }}/TestResults/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/TestResults/**/*.xml" \
            /d:sonar.verbose=true

      - name: Restore dependencies
        run: dotnet restore ERP.Microservices.sln

      - name: Build solution
        run: dotnet build ERP.Microservices.sln --configuration Release

      - name: Run tests with coverage
        env:
          DaprCliPath: ${{ env.DaprCliPath }}
          DAPR_HOME: ${{ env.DAPR_HOME }}
        run: |
          dotnet test ERP.Microservices.sln \
            --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            --logger "trx;LogFileName=test-results.trx" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Comment PR with SonarCloud link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        with:
          script: |
            const projectKey = process.env.SONAR_PROJECT_KEY;
            const branch = '${{ github.head_ref }}';
            const comment = `📊 **SonarCloud Analysis** for this pull request:\n\n🔗 [View on SonarCloud](https://sonarcloud.io/project/overview?id=${projectKey}&branch=${branch})`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
