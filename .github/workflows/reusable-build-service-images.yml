name: Build service images

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      do_push:
        required: true
        type: boolean
      platform:
        required: false
        type: string
        default: linux/amd64
      services_config_path:
        required: false
        type: string
        default: deploy/k8s/contracts/services.yaml

jobs:
  prepare:
    name: Prepare build context
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ghcr_repo: ${{ steps.repo.outputs.name }}
      base_image_registry: ${{ steps.repo.outputs.registry }}
      needs_shared_base: ${{ steps.catalog.outputs.needs_shared_base }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve GHCR coordinates
        id: repo
        shell: bash
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${name}/" >> "$GITHUB_OUTPUT"

      - name: Read services catalog
        id: catalog
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.services_config_path }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          NEEDS_SHARED_BASE="$(python - <<'PY'
          import os
          import yaml
          from pathlib import Path

          data = yaml.safe_load(Path(os.environ["CONFIG_PATH"]).read_text(encoding="utf-8"))
          include = [
              bool(item.get("runtime_from_shared_base", True))
              for item in data["services"]
          ]
          print("true" if any(include) else "false")
          PY
          )"
          echo "needs_shared_base=$NEEDS_SHARED_BASE" >> "$GITHUB_OUTPUT"

      - name: Build matrix from services catalog
        id: matrix
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.services_config_path }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          MATRIX_JSON="$(python - <<'PY'
          import json
          import os
          import yaml
          from pathlib import Path

          config_path = Path(os.environ["CONFIG_PATH"])
          data = yaml.safe_load(config_path.read_text(encoding="utf-8"))
          include = [
              {
                  "service": item["name"],
                  "dockerfile": item["dockerfile"],
                  "runtime_from_shared_base": bool(item.get("runtime_from_shared_base", True)),
              }
              for item in data["services"]
          ]
          print(json.dumps({"include": include}))
          PY
          )"
          {
            echo "matrix<<EOF"
            echo "$MATRIX_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-base-image:
    name: Build microservices base image
    needs: prepare
    if: ${{ needs.prepare.outputs.needs_shared_base == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/microservices-base.Dockerfile
          platforms: ${{ inputs.platform }}
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.ghcr_repo }}/myapp-microservices-base:10.0
            ghcr.io/${{ needs.prepare.outputs.ghcr_repo }}/myapp-microservices-base:${{ inputs.image_tag }}
          cache-from: type=gha,scope=microservices-base
          cache-to: type=gha,mode=max,scope=microservices-base

  build-images:
    name: Build ${{ matrix.service }}
    needs: [prepare, build-base-image]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build-base-image.result == 'success' || needs.build-base-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.do_push || matrix.runtime_from_shared_base }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build service image
        uses: ./.github/actions/build-service-image
        with:
          dockerfile: ${{ matrix.dockerfile }}
          service: ${{ matrix.service }}
          image_tag: ${{ inputs.image_tag }}
          do_push: ${{ inputs.do_push }}
          platform: ${{ inputs.platform }}
          ghcr_repo: ${{ needs.prepare.outputs.ghcr_repo }}
          base_image_registry: ${{ needs.prepare.outputs.base_image_registry }}
          runtime_from_shared_base: ${{ matrix.runtime_from_shared_base }}
