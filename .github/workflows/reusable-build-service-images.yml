name: Build service images

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      do_push:
        required: true
        type: boolean
      platform:
        required: false
        type: string
        default: linux/amd64
      services_config_path:
        required: false
        type: string
        default: deploy/k8s/contracts/services.yaml

jobs:
  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build matrix from services catalog
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          MATRIX_JSON="$(python - <<'PY'
          import json
          import yaml
          from pathlib import Path

          path = Path("${{ inputs.services_config_path }}")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          include = [
              {"service": item["name"], "dockerfile": item["dockerfile"]}
              for item in data["services"]
          ]
          print(json.dumps({"include": include}))
          PY
          )"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build-shared-base:
    name: Build shared base image
    if: ${{ inputs.do_push }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        if: ${{ inputs.do_push }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.do_push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repo name
        id: repo
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push shared base image
        if: ${{ inputs.do_push }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/microservices-base.Dockerfile
          platforms: ${{ inputs.platform }}
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/myapp-microservices-base:${{ inputs.image_tag }}
            ghcr.io/${{ steps.repo.outputs.name }}/myapp-microservices-base:10.0
            ghcr.io/${{ steps.repo.outputs.name }}/myapp-microservices-base:latest
          cache-from: type=gha,scope=base-image
          cache-to: type=gha,mode=max,scope=base-image

  build-images:
    name: Build ${{ matrix.service }}
    needs: [prepare-matrix, build-shared-base]
    if: ${{ needs.prepare-matrix.result == 'success' && (inputs.do_push == false || needs.build-shared-base.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        if: ${{ inputs.do_push }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.do_push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repo name
        id: repo
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute effective local build platform
        if: ${{ !inputs.do_push }}
        id: local-platform
        shell: bash
        run: |
          set -euo pipefail
          EFFECTIVE_PLATFORM="${{ inputs.platform }}"
          EFFECTIVE_PLATFORM="${EFFECTIVE_PLATFORM%%,*}"
          echo "value=$EFFECTIVE_PLATFORM" >> "$GITHUB_OUTPUT"
          if [[ "$EFFECTIVE_PLATFORM" != "${{ inputs.platform }}" ]]; then
            echo "Build-only runs use platform $EFFECTIVE_PLATFORM because docker buildx --load supports a single platform."
          fi

      - name: Build shared base image locally
        if: ${{ !inputs.do_push }}
        shell: bash
        run: |
          docker buildx build \
            --platform "${{ steps.local-platform.outputs.value }}" \
            --load \
            --file docker/microservices-base.Dockerfile \
            --tag myapp-microservices-base:10.0 \
            --tag "ghcr.io/${{ steps.repo.outputs.name }}/myapp-microservices-base:10.0" \
            .

      - name: Build image locally
        if: ${{ !inputs.do_push }}
        shell: bash
        run: |
          docker buildx build \
            --platform "${{ steps.local-platform.outputs.value }}" \
            --load \
            --build-arg BASE_IMAGE_REGISTRY= \
            --file "${{ matrix.dockerfile }}" \
            --tag "ghcr.io/${{ steps.repo.outputs.name }}/myapp-${{ matrix.service }}:${{ inputs.image_tag }}" \
            --tag "ghcr.io/${{ steps.repo.outputs.name }}/myapp-${{ matrix.service }}:latest" \
            .

      - name: Build and push image
        if: ${{ inputs.do_push }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platform }}
          push: true
          build-args: |
            BASE_IMAGE_REGISTRY=ghcr.io/${{ steps.repo.outputs.name }}/
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/myapp-${{ matrix.service }}:${{ inputs.image_tag }}
            ghcr.io/${{ steps.repo.outputs.name }}/myapp-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
