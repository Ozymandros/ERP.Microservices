name: Build service images

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      do_push:
        required: true
        type: boolean
      platform:
        required: false
        type: string
        default: linux/amd64
      services_config_path:
        required: false
        type: string
        default: deploy/k8s/contracts/services.yaml

jobs:
  prepare:
    name: Prepare build context
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
      ghcr_repo: ${{ steps.catalog.outputs.ghcr_repo }}
      base_image_registry: ${{ steps.catalog.outputs.base_image_registry }}
      needs_shared_base: ${{ steps.catalog.outputs.needs_shared_base }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read services catalog
        id: catalog
        shell: bash
        env:
          DO_PUSH: ${{ inputs.do_push }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          CONFIG_PATH: ${{ inputs.services_config_path }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python - <<'PY'
          import json
          import os
          import yaml
          from pathlib import Path

          do_push = os.environ["DO_PUSH"].lower() == "true"
          config_path = Path(os.environ["CONFIG_PATH"])
          data = yaml.safe_load(config_path.read_text(encoding="utf-8"))

          ghcr_repo = os.environ["GITHUB_REPOSITORY"].lower()
          # Service Dockerfiles always pull the shared base from GHCR in CI (see build-base-image).
          base_image_registry = f"ghcr.io/{ghcr_repo}/"

          include = [
              {
                  "service": item["name"],
                  "dockerfile": item["dockerfile"],
                  "runtime_from_shared_base": bool(item.get("runtime_from_shared_base", True)),
              }
              for item in data["services"]
          ]
          needs_shared_base = any(item["runtime_from_shared_base"] for item in include)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps({'include': include})}\n")
              f.write(f"ghcr_repo={ghcr_repo}\n")
              f.write(f"base_image_registry={base_image_registry}\n")
              f.write(f"needs_shared_base={'true' if needs_shared_base else 'false'}\n")
          PY

  build-base-image:
    name: Build microservices base image
    needs: prepare
    # Always run when the catalog includes shared-base services (not gated on do_push).
    if: ${{ needs.prepare.outputs.needs_shared_base == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/microservices-base.Dockerfile
          platforms: ${{ inputs.platform }}
          push: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.ghcr_repo }}/myapp-microservices-base:10.0
            ghcr.io/${{ needs.prepare.outputs.ghcr_repo }}/myapp-microservices-base:${{ inputs.image_tag }}
          cache-from: type=gha,scope=microservices-base
          cache-to: type=gha,mode=max,scope=microservices-base

  build-images:
    name: Build ${{ matrix.service }}
    needs: [prepare, build-base-image]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build-base-image.result == 'success' || needs.build-base-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.do_push || matrix.runtime_from_shared_base }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build service image
        uses: ./.github/actions/build-service-image
        with:
          dockerfile: ${{ matrix.dockerfile }}
          service: ${{ matrix.service }}
          image_tag: ${{ inputs.image_tag }}
          do_push: ${{ inputs.do_push }}
          platform: ${{ inputs.platform }}
          ghcr_repo: ${{ needs.prepare.outputs.ghcr_repo }}
          base_image_registry: ${{ needs.prepare.outputs.base_image_registry }}
          runtime_from_shared_base: ${{ matrix.runtime_from_shared_base }}
