name: Build service images

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      do_push:
        required: true
        type: boolean
      platform:
        required: false
        type: string
        default: linux/amd64
      services_config_path:
        required: false
        type: string
        default: deploy/k8s/contracts/services.yaml

jobs:
  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build matrix from services catalog
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          MATRIX_JSON="$(python - <<'PY'
          import json
          import yaml
          from pathlib import Path

          path = Path("${{ inputs.services_config_path }}")
          data = yaml.safe_load(path.read_text(encoding="utf-8"))
          include = [
              {"service": item["name"], "dockerfile": item["dockerfile"]}
              for item in data["services"]
          ]
          print(json.dumps({"include": include}))
          PY
          )"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.service }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.do_push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or build+push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platform }}
          push: ${{ inputs.do_push }}
          tags: |
            ghcr.io/${{ github.repository }}/myapp-${{ matrix.service }}:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository }}/myapp-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
