name: Bootstrap AWS Infrastructure (OIDC)

# Idempotent OpenTofu apply with admin IAM user keys.
# Persists state in S3 (+ DynamoDB locks), adopts an existing GitHub OIDC provider when present,
# then creates/updates EKS + deploy role. Set AWS_DEPLOY_ROLE_ARN from the job summary.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "OpenTofu tfvars profile"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      aws_region:
        description: "Optional override for var.aws_region"
        required: false
        default: ""
        type: string
      auto_approve:
        description: "Run tofu apply -auto-approve"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  workflow_call:
    inputs:
      profile:
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: ""
      auto_approve:
        required: false
        type: string
        default: "true"
    outputs:
      deploy_role_arn:
        description: "IAM role ARN for GitHub Actions OIDC"
        value: ${{ jobs.bootstrap.outputs.deploy_role_arn }}
      eks_cluster_name:
        value: ${{ jobs.bootstrap.outputs.eks_cluster_name }}
      aws_region:
        value: ${{ jobs.bootstrap.outputs.aws_region }}
    secrets:
      AWS_BOOTSTRAP_ACCESS_KEY_ID:
        required: true
      AWS_BOOTSTRAP_SECRET_ACCESS_KEY:
        required: true
      AWS_BOOTSTRAP_SESSION_TOKEN:
        required: false

concurrency:
  group: aws-bootstrap-${{ inputs.profile || github.event.inputs.profile }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: OpenTofu apply (${{ inputs.profile || github.event.inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require bootstrap credentials
        shell: bash
        env:
          BOOTSTRAP_KEY: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          BOOTSTRAP_SECRET: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$BOOTSTRAP_KEY" || -z "$BOOTSTRAP_SECRET" ]]; then
            echo "::error::Missing AWS_BOOTSTRAP_ACCESS_KEY_ID / AWS_BOOTSTRAP_SECRET_ACCESS_KEY secrets."
            echo "Create an IAM user with permissions for EKS + IAM OIDC, add keys as Actions secrets, run this workflow, then delete the secrets."
            exit 1
          fi

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Resolve tfvars and region
        id: tfvars
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          INPUT_AWS_REGION: ${{ inputs.aws_region }}
          VAR_STATE_BUCKET: ${{ vars.AWS_TF_STATE_BUCKET }}
          VAR_LOCK_TABLE: ${{ vars.AWS_TF_LOCK_TABLE }}
        run: |
          set -euo pipefail
          read_tfvar() {
            local name="$1" file="$2" default="${3:-}"
            [[ ! -f "$file" ]] && { echo "$default"; return; }
            local line
            line="$(grep -E "^[[:space:]]*${name}[[:space:]]*=" "$file" | tail -1 || true)"
            [[ -z "$line" ]] && { echo "$default"; return; }
            echo "$line" | sed -E 's/^[^=]+=[[:space:]]*"?([^"#[:space:]]+)"?.*/\1/' | tr -d "'"
          }
          TOFU_DIR="deploy/aws/tofu"
          if [[ -f "${TOFU_DIR}/terraform.tfvars" ]]; then
            TFVARS_FILE="terraform.tfvars"
            TFVARS_PATH="${TOFU_DIR}/terraform.tfvars"
          elif [[ -f "${TOFU_DIR}/environments/${PROFILE}/terraform.tfvars" ]]; then
            TFVARS_FILE="environments/${PROFILE}/terraform.tfvars"
            TFVARS_PATH="${TOFU_DIR}/${TFVARS_FILE}"
          else
            TFVARS_FILE="environments/${PROFILE}/terraform.tfvars.example"
            TFVARS_PATH="${TOFU_DIR}/${TFVARS_FILE}"
          fi
          if [[ ! -f "$TFVARS_PATH" ]]; then
            echo "::error::No tfvars for profile '${PROFILE}' at ${TFVARS_PATH}."
            echo "Add environments/${PROFILE}/terraform.tfvars(.example) or a root terraform.tfvars."
            exit 1
          fi
          AWS_REGION="$INPUT_AWS_REGION"
          if [[ -z "$AWS_REGION" ]]; then
            AWS_REGION="$(read_tfvar aws_region "$TFVARS_PATH" "eu-west-1")"
          fi
          STATE_BUCKET="${VAR_STATE_BUCKET:-myapp-tfstate-${PROFILE}}"
          LOCK_TABLE="${VAR_LOCK_TABLE:-myapp-tf-locks}"
          STATE_KEY="aws/${PROFILE}/eks/terraform.tfstate"
          ENABLE_OIDC="true"
          {
            echo "tfvars_file=$TFVARS_FILE"
            echo "aws_region=$AWS_REGION"
            echo "profile=$PROFILE"
            echo "state_bucket=$STATE_BUCKET"
            echo "lock_table=$LOCK_TABLE"
            echo "state_key=$STATE_KEY"
            echo "enable_oidc=$ENABLE_OIDC"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$INPUT_AWS_REGION" ]]; then
            echo "aws_region_var=-var=aws_region=${INPUT_AWS_REGION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (bootstrap)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_BOOTSTRAP_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_BOOTSTRAP_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_BOOTSTRAP_SESSION_TOKEN }}
          aws-region: ${{ steps.tfvars.outputs.aws_region }}

      - name: Ensure OpenTofu state backend
        shell: bash
        env:
          AWS_REGION: ${{ steps.tfvars.outputs.aws_region }}
          STATE_BUCKET: ${{ steps.tfvars.outputs.state_bucket }}
          LOCK_TABLE: ${{ steps.tfvars.outputs.lock_table }}
        run: |
          set -euo pipefail
          echo "State bucket=${STATE_BUCKET} lock_table=${LOCK_TABLE} region=${AWS_REGION}"

          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "S3 bucket already exists."
          else
            echo "Creating S3 bucket ${STATE_BUCKET}..."
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$STATE_BUCKET" \
                --create-bucket-configuration "LocationConstraint=${AWS_REGION}"
            fi
            aws s3api put-bucket-versioning \
              --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block \
              --bucket "$STATE_BUCKET" \
              --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

          if aws dynamodb describe-table --table-name "$LOCK_TABLE" >/dev/null 2>&1; then
            echo "DynamoDB lock table already exists."
          else
            echo "Creating DynamoDB lock table ${LOCK_TABLE}..."
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE"
          fi

      - name: Resolve existing GitHub OIDC provider
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_ARN=""
          while IFS=$'\t' read -r arn; do
            [[ -z "$arn" ]] && continue
            if [[ "$arn" == *":oidc-provider/token.actions.githubusercontent.com" ]]; then
              PROVIDER_ARN="$arn"
              break
            fi
          done < <(aws iam list-open-id-connect-providers --query 'OpenIDConnectProviderList[].Arn' --output text | tr '\t' '\n')
          if [[ -n "$PROVIDER_ARN" ]]; then
            echo "Adopting existing GitHub OIDC provider: ${PROVIDER_ARN}"
            echo "provider_arn=$PROVIDER_ARN" >> "$GITHUB_OUTPUT"
          else
            echo "No existing GitHub OIDC provider; tofu may create one."
            echo "provider_arn=" >> "$GITHUB_OUTPUT"
          fi

      - name: OpenTofu init, plan, apply
        working-directory: deploy/aws/tofu
        shell: bash
        env:
          TFVARS_FILE: ${{ steps.tfvars.outputs.tfvars_file }}
          AWS_REGION_VAR: ${{ steps.tfvars.outputs.aws_region_var }}
          AUTO_APPROVE: ${{ inputs.auto_approve }}
          AWS_REGION: ${{ steps.tfvars.outputs.aws_region }}
          STATE_BUCKET: ${{ steps.tfvars.outputs.state_bucket }}
          LOCK_TABLE: ${{ steps.tfvars.outputs.lock_table }}
          STATE_KEY: ${{ steps.tfvars.outputs.state_key }}
          ENABLE_OIDC: ${{ steps.tfvars.outputs.enable_oidc }}
          GITHUB_OIDC_PROVIDER_ARN: ${{ steps.oidc.outputs.provider_arn }}
        run: |
          set -euo pipefail
          VAR_ARGS=(-var-file="$TFVARS_FILE")
          if [[ -n "${AWS_REGION_VAR:-}" ]]; then
            VAR_ARGS+=("$AWS_REGION_VAR")
          fi
          if [[ "$ENABLE_OIDC" == "true" ]]; then
            VAR_ARGS+=("-var=enable_github_actions_deploy=true")
          else
            VAR_ARGS+=("-var=enable_github_actions_deploy=false")
          fi
          if [[ -n "${GITHUB_OIDC_PROVIDER_ARN:-}" ]]; then
            VAR_ARGS+=("-var=github_oidc_provider_arn=${GITHUB_OIDC_PROVIDER_ARN}")
          fi

          tofu fmt -check -recursive
          tofu init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}" \
            -backend-config="encrypt=true"
          tofu validate "${VAR_ARGS[@]}"
          tofu plan "${VAR_ARGS[@]}" -out=tfplan
          if [[ "$AUTO_APPROVE" == "true" ]]; then
            tofu apply -auto-approve tfplan
          else
            echo "auto_approve=false — review the plan above and re-run with auto_approve=true"
            exit 1
          fi

      - name: Verify GitHub OIDC provider
        if: ${{ steps.tfvars.outputs.enable_oidc == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! aws iam list-open-id-connect-providers --output text | grep -q 'token.actions.githubusercontent.com'; then
            echo "::error::GitHub OIDC provider still missing after apply. Check enable_github_actions_deploy in tfvars."
            exit 1
          fi
          echo "GitHub OIDC provider present."

      - name: Publish outputs for GitHub configuration
        id: publish
        working-directory: deploy/aws/tofu
        shell: bash
        env:
          ENABLE_OIDC: ${{ steps.tfvars.outputs.enable_oidc }}
          STATE_BUCKET: ${{ steps.tfvars.outputs.state_bucket }}
          STATE_KEY: ${{ steps.tfvars.outputs.state_key }}
          LOCK_TABLE: ${{ steps.tfvars.outputs.lock_table }}
        run: |
          set -euo pipefail
          CLUSTER="$(tofu output -raw eks_cluster_name)"
          REGION="$(tofu output -raw aws_region)"
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ROLE=""
          if [[ "$ENABLE_OIDC" == "true" ]]; then
            ROLE="$(tofu output -raw github_actions_deploy_role_arn)"
          fi
          {
            echo "## Bootstrap complete (idempotent)"
            echo ""
            echo "Re-running this workflow with the same profile converges against remote state"
            echo "(\`${STATE_BUCKET}/${STATE_KEY}\`, lock table \`${LOCK_TABLE}\`)."
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| AWS account | \`${ACCOUNT}\` |"
            echo "| EKS cluster | \`${CLUSTER}\` |"
            echo "| Region | \`${REGION}\` |"
            echo "| State bucket | \`${STATE_BUCKET}\` |"
            if [[ -n "$ROLE" ]]; then
              echo ""
              echo "### Required: set repository variable"
              echo ""
              echo "\`AWS_DEPLOY_ROLE_ARN\` = \`${ROLE}\`"
              echo ""
              echo "Settings → Secrets and variables → Actions → Variables"
            fi
            echo ""
            echo "### Then"
            echo "1. Delete secrets \`AWS_BOOTSTRAP_ACCESS_KEY_ID\` and \`AWS_BOOTSTRAP_SECRET_ACCESS_KEY\` when finished bootstrapping (recommended)."
            echo "2. Re-run **Deploy AWS Kubernetes Stack** with \`infra_step=skip\` or \`apply\` as needed."
            echo ""
            echo "Stacks created **before** remote state was enabled need one-time import or destroy/recreate;"
            echo "an existing GitHub OIDC provider is auto-adopted."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "deploy_role_arn=$ROLE" >> "$GITHUB_OUTPUT"
          echo "eks_cluster_name=$CLUSTER" >> "$GITHUB_OUTPUT"
          echo "aws_region=$REGION" >> "$GITHUB_OUTPUT"

    outputs:
      deploy_role_arn: ${{ steps.publish.outputs.deploy_role_arn }}
      eks_cluster_name: ${{ steps.publish.outputs.eks_cluster_name }}
      aws_region: ${{ steps.publish.outputs.aws_region }}
